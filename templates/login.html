<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion utilisateur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #f5f6fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(44, 62, 80, 0.08);
            min-width: 320px;
        }
        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            color: #636e72;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        input {
            padding: 0.7rem;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0984e3;
            outline: none;
        }
        button {
            background: #0984e3;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 0.8rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #74b9ff;
        }
        .msg { margin-top:10px; font-size:14px; color:#d9534f; }

    </style>
</head>
<body>
    <div class="login-container">
        <h2>Connexion</h2>
        {% if message %}
        <div class="msg">{{ message }}</div>
        {% endif %}
        <form method="post" autocomplete="off">
            <label for="user_login">Login</label>
            <input type="text" id="user_login" name="user_login" placeholder="Votre Login" required>
            <label for="user_password">Mot de passe</label>
            <input type="password" id="user_password" name="user_password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
            <p>Vous n'avez pas de compte ? <a href="/register">S'inscrire</a></p>
        </form>
    </div>
</body>
</html>
