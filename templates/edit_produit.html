<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Produits</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
      {% include 'navBar.html' %}
    <h1 class="text-3xl font-bold text-center my-8">{{ produit.designation_p }} </h1>
        
    <div class="max-w-lg mx-auto mt-10 p-6 bg-white shadow rounded">
    <h1 class="text-2xl font-semibold mb-6 text-center">Modifier les informations du produit</h1>

    <form action="{{ url_for('update_produit', id_p=produit.id_p) }}" method="POST" class="space-y-4">
        <div>
        <label class="block text-gray-700">Type</label>
        <input type="text" name="type_p" value="{{ produit.type_p }}" class="w-full border p-2 rounded" required>
        </div>

        <div>
        <label class="block text-gray-700">Désignation</label>
        <input type="text" name="designation_p" value="{{ produit.designation_p }}" class="w-full border p-2 rounded" required>
        </div>

        <div>
        <label class="block text-gray-700">Prix HT</label>
        <input type="number" step="0.01" name="prix_ht" value="{{ produit.prix_ht }}" class="w-full border p-2 rounded" required>
        </div>

        <div>
        <label class="block text-gray-700">Stock</label>
        <input type="number" name="stock_p" value="{{ produit.stock_p }}" class="w-full border p-2 rounded" required>
        </div>

        <div class="text-center">
        <button type="submit" class="bg-gray-500 text-white text-sm  px-3 py-1 rounded hover:bg-white hover:text-black border border-gray-500 ">
            Enregistrer les modifications
        </button>
        </div>
    </form>
    </div>
</body>
</html>
