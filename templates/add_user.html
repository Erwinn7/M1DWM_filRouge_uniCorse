<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un utilisateur</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">
  {% include 'navBar.html' %}

  <div class="flex justify-center items-center h-screen bg-gray-100 font-sans">
  <div class="bg-white p-10 rounded-xl shadow-lg min-w-[510px]">
    <h1 class="text-center text-gray-800 mb-6 text-xl font-semibold">Ajouter un utilisateur</h1>

    <form action="{{ url_for('add_user') }}" method="POST" class="flex flex-col gap-4">
      
      <div class="flex flex-col">
        <label for="user_login" class="text-gray-600 text-base mb-1">Nom d'utilisateur</label>
        <input type="text" name="user_login" placeholder="Ex: jdoe"
               class="border border-gray-300 rounded-md p-3 text-base focus:border-blue-500 focus:outline-none"
               required>
      </div>

      <div class="flex flex-col">
        <label for="user_mail" class="text-gray-600 text-base mb-1">Email</label>
        <input type="email" name="user_mail" placeholder="Ex: jdoe@mail.com"
               class="border border-gray-300 rounded-md p-3 text-base focus:border-blue-500 focus:outline-none"
               required>
      </div>

      <div class="flex flex-col">
        <label for="user_password" class="text-gray-600 text-base mb-1">Mot de passe</label>
        <input type="password" name="user_password"
               class="border border-gray-300 rounded-md p-3 text-base focus:border-blue-500 focus:outline-none"
               required>
      </div>

      <div class="text-center">
        <button type="submit"
            class="bg-gray-500 text-white text-sm mb-4 px-3 py-1 rounded hover:bg-white hover:text-black border border-gray-500 transition-colors">
           Ajouter l'utilisateur
        </button>
      </div>

      <p class="msg text-red-600 text-sm mt-2"></p>
    </form>
  </div>
</div>

</body>
</html>
