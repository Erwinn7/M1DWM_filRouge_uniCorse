<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscription</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 24px;
      width: 360px;
    }
    h2 { margin-top: 0; margin-bottom: 12px; font-size: 20px; }
    label { display:block; margin-top:10px; font-size:14px; }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top:6px;
      border: 1px solid #d6dced;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .row {
      display:flex;
      gap:8px;
    }
    .btn {
      margin-top:16px;
      width:100%;
      padding:10px;
      border: none;
      background: #2b6ef6;
      color: white;
      font-weight:600;
      border-radius:6px;
      cursor:pointer;
    }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { margin-top:10px; font-size:14px; color:#d9534f; }
    .success { color: #2e7d32; }
    small { color:#666; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Créer un compte</h2>

    <!-- zone pour afficher un message passé depuis Flask -->
    {% if message %}
      <div class="msg">{{ message }}</div>
    {% endif %}

    <form id="registerForm" method="post" novalidate>
      <label for="user_login">Nom d'utilisateur</label>
      <input id="user_login" name="user_login" type="text" required minlength="3" maxlength="50" placeholder="ex: erwinn">

      <label for="user_mail">Email <small>(optionnel)</small></label>
      <input id="user_mail" name="user_mail" type="email" placeholder="adresse@example.com">

      <label for="user_password">Mot de passe</label>
      <input id="user_password" name="user_password" type="password" required minlength="6" placeholder="Mot de passe">

      <label for="confirm_password">Confirmer le mot de passe</label>
      <input id="confirm_password" name="confirm_password" type="password" required placeholder="Confirmer le mot de passe">

      <button id="submitBtn" class="btn" type="submit">S'inscrire</button>

      <div id="error" class="msg" role="alert" aria-live="polite" style="display:none;"></div>
      <div id="success" class="msg success" style="display:none;"></div>

      <p>Vous avez déjà un compte ? <a href="/login">Se connecter</a></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const pwd = document.getElementById('user_password');
    const confirm = document.getElementById('confirm_password');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = msg;
      successDiv.style.display = 'none';
    }
    function showSuccess(msg) {
      successDiv.style.display = 'block';
      successDiv.textContent = msg;
      errorDiv.style.display = 'none';
    }

    form.addEventListener('submit', (e) => {
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (pwd.value.length < 6) {
        e.preventDefault();
        showError('Le mot de passe doit contenir au moins 6 caractères.');
        return;
      }
      if (pwd.value !== confirm.value) {
        e.preventDefault();
        showError('Les mots de passe ne correspondent pas.');
        return;
      }
      
      // Vérifie la complexité du mot de passe avec une expression régulière globale
      const pwdValue = pwd.value;
      const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).+$/;

      if (!regex.test(pwdValue)) {
        e.preventDefault();
        showError('Le mot de passe doit contenir au moins une lettre majuscule, un chiffre et un caractère spécial.');
        return;
      }


      // optionally disable the button to prevent double submit
      submitBtn.disabled = true;
    });
  </script>
</body>
</html>
